# Single-node private regtest chain, from genesis.
#
# This is a trimmed copy of the `teranode1` node in docker-compose-3blasters.yml.
# It brings up ONE teranode (all services in one process) plus its own Postgres,
# Aerospike and Kafka (Redpanda), and a block generator that mines from genesis.
#
# Why this is "a new blockchain from genesis":
#   - SETTINGS_CONTEXT=docker.teranode1.test resolves `network = regtest`
#     (see settings.conf: `network.docker = regtest`), so chain params / genesis
#     come from go-chaincfg RegressionNetParams.
#   - The data dirs below start empty, so the node boots at the regtest genesis
#     block (height 0) and the block-generator mines blocks 1..N via the
#     `generate` RPC.
#   - It is private: P2P and legacy sync are disabled, so it never talks to any
#     other network. Wipe ../data/regtest to start a brand-new chain again.
#
# Usage:
#   make build                                                    # build teranode:latest
#   docker compose -f compose/docker-compose-regtest.yml up -d
#   # RPC on localhost:19292 (user/pass bitcoin/bitcoin), dashboard on localhost:18090
#   # mine more blocks by hand:
#   curl --user bitcoin:bitcoin -X POST http://localhost:19292 \
#        -H 'Content-Type: application/json' \
#        -d '{"method":"generate","params":[10]}'
#   docker compose -f compose/docker-compose-regtest.yml down       # stop (keeps data)
#   rm -rf data/regtest                                             # reset to genesis

networks:
  teranode-network:
    name: teranode-network-regtest

services:
  postgres:
    container_name: regtest-postgres
    image: postgres:latest
    networks:
      - teranode-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: really_strong_password_change_me
      POSTGRES_DB: postgres
    ports:
      - "15433:5432"
    expose:
      - "5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-shared:
    container_name: regtest-kafka
    # Pinned: redpandadata/redpanda:latest drifted to a build that SIGILLs (Invalid instruction)
    # on this host's CPU. v25.2.1 is the last known-good tag here.
    image: redpandadata/redpanda:v25.2.1
    networks:
      - teranode-network
    mem_limit: 256m
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka-shared:9092
      - --pandaproxy-addr 0.0.0.0:9093
      - --advertise-pandaproxy-addr localhost:9093
    expose:
      - "8081"
      - "9092"
      - "9093"
    volumes:
      - ../data/regtest/kafka:/var/lib/kafka

  aerospike-1:
    container_name: regtest-aerospike
    image: aerospike/aerospike-server:8.1
    networks:
      - teranode-network
    command: --config-file /etc/aerospike.conf
    expose:
      - "3100"
    volumes:
      - ./aerospike/aerospike-1.conf:/etc/aerospike.conf
      - ../data/regtest/aerospike/logs:/var/log/aerospike
      - ../data/regtest/aerospike/data:/opt/aerospike/data

  teranode1:
    container_name: regtest-teranode1
    image: teranode:latest
    networks:
      - teranode-network
    depends_on:
      postgres:
        condition: service_healthy
      kafka-shared:
        condition: service_started
      aerospike-1:
        condition: service_started
    entrypoint:
      [
        "/app/wait.sh",
        "aerospike-1",
        "3100",
        "2",
        "--",
        "/app/wait.sh",
        "postgres",
        "5432",
        "0",
        "--",
        "/app/wait.sh",
        "kafka-shared",
        "9092",
        "0",
        "--",
        "/app/teranode.run",
        "-localTestStartFromState=RUNNING",
      ]
    environment:
      SETTINGS_CONTEXT: "docker.teranode1.test"
      logLevel: "INFO"
      # NECESSARY OVERRIDE (BOLT-Stack-Demo): upstream regtest ships P2P OFF for a fully-isolated
      # single node. We deliberately turn it ON so a local Arcade's chaintracks can track this
      # node's blocks over libp2p (the demo's SPV header source). Still a single private teranode —
      # legacy (bitcoind-style) sync stays OFF. (Paired with the p2p_listen/advertise overrides in
      # settings.conf so libp2p binds a known, dialable port.)
      startP2P: "true"
      startLegacy: "false"
      KAFKA_BLOCKS: blocks-teranode1
      KAFKA_BLOCKS_FINAL: blocks-final-teranode1
      KAFKA_INVALID_BLOCKS: invalid-blocks-teranode1
      KAFKA_INVALID_SUBTREES: invalid-subtrees-teranode1
      KAFKA_LEGACY_INV: legacy-inv-teranode1
      KAFKA_REJECTEDTX: rejectedtx-teranode1
      KAFKA_SUBTREES: subtrees-teranode1
      KAFKA_TXMETA: txmeta-teranode1
      KAFKA_VALIDATORTXS: validatortxs-teranode1
    volumes:
      # LF-normalized copies generated by regtest.ps1 `up` (the repo files have
      # CRLF on Windows checkouts, which corrupts config values / shebangs in the
      # Linux containers). Run `up` via the script, not `docker compose` directly.
      - ../data/regtest/mounts/settings.conf:/app/settings.conf
      - ../data/regtest/mounts/settings_test.conf:/app/settings_local.conf
      # wait.sh is bundled in the image (LF line endings); do not bind-mount the
      # repo copy here — on Windows its CRLF endings break the #!/bin/sh shebang.
      - ../data/regtest/teranode1/txstore:/app/data/txstore
      - ../data/regtest/teranode1/subtreestore:/app/data/subtreestore
      - ../data/regtest/teranode1/blockstore:/app/data/blockstore
      - ../data/regtest/teranode1/subtree_quorum:/app/data/subtree_quorum
      - ../data/regtest/teranode1/external:/app/data/external
    ports:
      - "18000:8000"   # health
      - "18090:8090"   # asset / blockchain viewer (dashboard)
      - "18081-18092:8081-8092"
      - "19292:9292"   # RPC

  block-generator:
    container_name: regtest-block-generator
    image: curlimages/curl:latest
    networks:
      - teranode-network
    depends_on:
      - teranode1
    volumes:
      - ../data/regtest/mounts/generate-blocks.sh:/generate-blocks.sh
    # Pre-mine 10 blocks from genesis, then keep mining one block at a time.
    # Set --stopHeight to a number (instead of leaving it off) to stop mining.
    entrypoint:
      [
        "/generate-blocks.sh",
        "--host",
        "teranode1",
        "--generate",
        "--initialBlocks",
        "10",
      ]
    restart: no
